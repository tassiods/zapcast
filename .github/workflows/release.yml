name: release

# Explicit publication, never dependent on token-generated tag events.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      publish:
        description: Publish after all same-SHA gates (false is credential-free dry-run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
  publish:
    needs: gates
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    # Configure required reviewers for this environment before enabling publication.
    environment: production-release
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-release-${{ github.sha }}
          path: release-artifacts
      - name: Validate the exact tested artifact; no rebuild
        run: python3 scripts/release.py --dry-run --version "$VERSION" --artifacts release-artifacts --sha "$GITHUB_SHA"
      - name: Publish validated artifact
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py --publish --version "$VERSION" --artifacts release-artifacts --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
